name: Tes terlihat

on:
  push:
  pull_request:

jobs:
  sql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/sql
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B test

  json:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: core/json/package-lock.json
      - run: npm ci
      - run: npm test
