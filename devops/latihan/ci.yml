# Workflow CI SiPenugasan. Perbaiki sampai tes terlihat lulus.
name: CI

on:
  pull_request:

jobs:
  tes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "14"
      - run: npm test
      - run: npm ci
