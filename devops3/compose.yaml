# Latihan d3-compose-01: compose ini belum benar. Perbaiki sesuai materi topik 2 dan 3.
services:
  api:
    build: ./app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://sipenugasan:rahasia123@localhost:5432/sipenugasan
    depends_on:
      - db

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: sipenugasan
      POSTGRES_DB: sipenugasan
      POSTGRES_PASSWORD: rahasia123
    ports:
      - "5432:5432"
