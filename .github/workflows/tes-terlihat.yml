name: Tes terlihat

on:
  push:
  pull_request:

jobs:
  sql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/sql
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B test

  json:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: core/json/package-lock.json
      - run: npm ci
      - run: npm test

  # Minggu 2-3. Job jalur lain boleh merah: kerjakan folder jalurmu saja.
  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/react
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dev/react/package-lock.json
      - run: npm ci
      - run: npm test

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B test

  qa-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa/unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: qa/unit/package-lock.json
      - run: npm ci
      - run: npm run cek

  qa-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: qa/api/package-lock.json
      - run: npm ci
      - run: npm run cek
